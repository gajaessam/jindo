name: Build Windows app

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Get source files
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install build tools
        run: python -m pip install -r requirements-build.txt

      - name: Build app and ZIP
        run: .\build_release.ps1

      - name: Save ZIP for download
        uses: actions/upload-artifact@v7
        with:
          name: UsagiJindo-Windows-x64
          path: release/UsagiJindo-v*-Windows-x64.zip
          if-no-files-found: error
